# Runs the project's own checks (astro check, stylelint, Prettier) on every pull request, so a
# token or type slip shows up on the PR before the Cloudflare preview finishes building.
name: Check

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
